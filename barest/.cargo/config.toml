[build]
target = "x86_64-bootimage-barest.json"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-bootimage-barest]
rustflags = [
    "-C", "link-arg=--entry=kernel_main",    # Specify kernel_main as entry point
    "-C", "link-arg=--gc-sections",         # Remove unused sections
    "-C", "link-arg=-z", "-C", "link-arg=notext" # Avoid text relocations
]
